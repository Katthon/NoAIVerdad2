<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoAIVerdad - Monitoreo Electoral e Inteligencia Cívica</title>
  <meta http-equiv="refresh" content="0; url=frontend/">
  <script>
    // Redirigir conservando posibles parámetros query o hash
    window.location.replace("frontend/" + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    a {
      color: #6366f1;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #4f46e5;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Cargando NoAIVerdad...</h2>
  <p>Si no eres redirigido automáticamente, <a href="frontend/">haz clic aquí para ingresar a la plataforma</a>.</p>
</body>
</html>
